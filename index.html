<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9f5424">
  <meta name="description" content="Cards by Nile AI. Play classic Ugandan Matatu on a familiar wooden table, offline or with a friend on the same device.">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/styles.css">
  <script type="module" src="./src/app.js"></script>
  <title>Cards · Matatu</title>
</head>
<body data-theme="wood">
  <main class="board">
    <section id="home-screen" class="lobby" aria-labelledby="home-title">
      <header class="lobby-top"><span class="small-brand">NILE AI</span><button class="wood-button" data-action="help">? &nbsp; Help</button></header>
      <div class="lobby-title"><span class="title-suits" aria-hidden="true">♠ <i>♥</i> ♣ <i>♦</i></span><h1 id="home-title">Cards</h1><p>The Matatu you know.</p></div>
      <div class="mode-menu">
        <button class="mode-tile classic-tile" data-action="start" data-mode="classic"><span class="mini-fan" aria-hidden="true"><i>A<span>♥</span></i><i>8<span>♠</span></i><i>2<span>♦</span></i></span><strong>Classic</strong><small>Play against the computer</small><span class="tile-play">Play &nbsp;▶</span></button>
        <button class="mode-tile joker-tile" data-action="start" data-mode="joker"><span class="joker-art" aria-hidden="true">✦<i>★</i>✦</span><strong>Joker</strong><small>Classic with two Jokers</small><span class="tile-play">Play &nbsp;▶</span></button>
        <button class="mode-tile friend-tile" data-action="start" data-mode="local"><span class="friends-art" aria-hidden="true">●<i>VS</i>●</span><strong>2 players</strong><small>Pass this device to a friend</small><span class="tile-play">Play &nbsp;▶</span></button>
      </div>
      <footer class="lobby-bottom"><button class="wood-button" data-action="stats">My scores</button><div class="home-record"><strong id="home-wins">0 wins</strong><small>Just one more round.</small></div><button class="wood-button" data-action="settings">Customize</button></footer>
      <span class="offline-note">No account needed · Play offline after your first visit</span>
    </section>
    <section id="game-screen" class="game" hidden aria-label="Matatu table">
      <header class="game-top"><button class="wood-button" data-action="menu">☰ <span>Menu</span></button><span id="mode-label">Classic</span><button class="wood-button" data-action="help">? <span>Help</span></button></header>
      <div class="opponent-area"><div class="seat-label"><strong id="opponent-name">Computer</strong><span id="opponent-count">7 cards</span></div><div id="opponent-hand" class="opponent-hand" aria-label="Opponent's cards"></div></div>
      <div class="table-center">
        <div class="cut-marker"><small>Cut with</small><strong id="cut-mark">7♠</strong></div>
        <div class="table-piles"><button id="discard" class="discard" data-action="pass" aria-label="Table card; tap to end your turn after drawing"></button><div class="draw-stack"><button id="draw-deck" class="card-back" data-action="draw" aria-label="Draw a card"><span>✦</span></button><span id="draw-label">Pick a card</span></div></div>
        <div class="suit-marker"><small>Suit</small><strong id="suit-mark">♠</strong></div>
      </div>
      <div class="move-message" id="move-message" role="status" aria-live="polite">Your turn</div>
      <div id="last-move" class="last-move" aria-live="polite">Tap a matching card.</div>
      <div class="player-area"><div class="seat-label"><strong id="player-name">You</strong><span id="player-points">0 points</span></div><div id="player-hand" class="player-hand" aria-label="Your cards"></div></div>
      <footer class="game-actions"><span id="hand-count">7 cards</span><button class="wood-button cut-button" data-action="cut" hidden>Cut game</button><button class="wood-button" data-action="pass" id="pass-button" hidden>End turn</button><button class="wood-button" data-action="sound" id="sound-button" aria-label="Turn sound off">♫</button></footer>
    </section>
  </main>
  <div class="overlay" id="overlay" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section></div>
  <span id="announcer" class="sr-only" aria-live="polite"></span>
</body>
</html>
